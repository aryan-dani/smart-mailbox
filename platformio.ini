; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
	-D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY

lib_deps =
	; Servo is bundled with the ESP8266 Arduino core

; Uncomment if you use a Wemos D1 Mini instead of NodeMCU
; [env:d1_mini]
; platform = espressif8266
; board = d1_mini
; framework = arduino
; monitor_speed = 115200
