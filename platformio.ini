; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
; 115200 is reliable for most NodeMCU boards. Raise to 460800/921600 later
; only if uploads are consistently successful at this speed.
upload_speed = 115200

; Servo is bundled with the ESP8266 Arduino core.
; PubSubClient will be added when ENABLE_MQTT is turned on (Stage 5).

; Uncomment if you use a Wemos D1 Mini instead of NodeMCU:
; [env:d1_mini]
; platform = espressif8266
; board = d1_mini
; framework = arduino
; monitor_speed = 115200
; upload_speed = 115200
